<text x="56.0" y="279.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">The whole problem is the overflow guard: BEFORE res·10 + d, check res against</text>
